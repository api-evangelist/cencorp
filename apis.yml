name: Cencorp
description: Cencorp (Zhuhai) Industrial Technology Co., Ltd. is a process-automation equipment
  manufacturer that designs and builds high-end laser processing, dispensing, automated optical
  inspection (AOI), and system-integration & automation systems for the consumer electronics,
  automotive electronics, semiconductor, and new-energy industries. Formed in 2020 and combining
  the acquired Finland-based Cencorp automation business with operations headquartered in Zhuhai,
  China, the company runs 12 offices worldwide with 400+ R&D engineers and 300+ patents, and is a
  portfolio company of Qiming Venture Partners. It exposes no public developer API, SDK, or
  developer portal — this is a physical automation-equipment business.
